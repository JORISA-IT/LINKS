<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- ============================================================
     CAMBIA SOLO ESTA LÍNEA: pon el enlace de destino tras "url="
     Ejemplos: https://www.tuweb.com  ·  documento.pdf (si subes el PDF a este repositorio)
     ============================================================ -->
<meta http-equiv="refresh" content="0; url=CUADERNO DEL VIAJERO.pdf">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Un momento…</title>
<style>
  :root { --fondo:#1F3A5F; --texto:#F5F8FB; --suave:#A9BCD0; --acento:#6CC3E6; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    background:var(--fondo); color:var(--texto);
    font-family:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    display:grid; place-items:center; text-align:center; padding:2rem;
  }
  .marca { width:56px; height:56px; margin:0 auto 1.5rem; }
  .marca circle { fill:none; stroke:var(--acento); stroke-width:4; stroke-linecap:round;
                  stroke-dasharray:120 60; transform-origin:center; animation:giro 1.1s linear infinite; }
  h1 { font-size:1.25rem; font-weight:600; letter-spacing:.01em; }
  p { color:var(--suave); font-size:.95rem; margin-top:.5rem; }
  a { color:var(--acento); }
  a:focus-visible { outline:2px solid var(--acento); outline-offset:3px; }
  @keyframes giro { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .marca circle { animation:none; } }
</style>
</head>
<body>
  <main>
    <svg class="marca" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="24"/></svg>
    <h1>Te llevamos a tu destino</h1>
    <p>Si no se abre solo, <a id="enlace" href="#">pulsa aquí</a>.</p>
  </main>
<script>
  // Lee el destino de la línea de arriba, así solo hay que cambiarlo en un sitio
  var m = document.querySelector('meta[http-equiv="refresh"]');
  var destino = m.content.split(/url=/i)[1];
  document.getElementById('enlace').href = destino;
  location.replace(destino);
</script>
</body>
</html>
